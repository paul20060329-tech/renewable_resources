<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>绿循智审 · 安全登录</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-panel">
      <div class="panel-head">
        <div class="small-logo">GL</div>
        <div><strong>登录工作台</strong><p>使用授权账户继续访问</p></div>
      </div>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <form method="post">
        <label>账号<input required name="username" placeholder="请输入账号" autocomplete="username"></label>
        <label>密码<input required name="password" type="password" placeholder="请输入密码" autocomplete="current-password"></label>
        <div class="form-meta"><span><i></i> 安全连接</span><span>登录行为将被记录</span></div>
        <button class="primary full" type="submit">进入合规工作台 <span>→</span></button>
      </form>
      <p class="security-note">受控访问 · 数据仅用于业务合规审核</p>
    </section>
    <section class="login-brand">
      <div class="brand-visual-top">
        <div class="brand-mark">GL</div>
        <span class="brand-status"><i></i> 服务在线 · 数据持续留痕</span>
      </div>
      <div class="brand-kicker"><span class="signal"></span> GREENLOOP COMPLIANCE CLOUD</div>
      <h1><span class="hero-line">让每一笔再生资源交易</span><span class="hero-line accent">可验证、可追溯。</span></h1>
      <p class="brand-copy">面向绿色金融尽调与付款审核的再生金属业务合规平台。</p>
      <div class="brand-proof">
        <div><b>09</b><span>固定合规规则</span></div>
        <div><b>100%</b><span>业务链路留痕</span></div>
        <div><b>01</b><span>付款控制入口</span></div>
      </div>
      <div class="brand-line"></div>
      <p class="brand-foot">川西再生资源有限公司 · 内部业务系统</p>
    </section>
  </main>
</body>
</html>
